# What is enforced, and why.
#
# The gate is `rake lint`: the Lint, Security and Metrics departments. Those catch
# mistakes -- a rescued Exception, an unreachable branch, a method nobody can read.
# The Style department is deliberately not enforced. This code has a consistent house
# style (single quotes, no frozen_string_literal comments, aligned hash rockets) that
# disagrees with half of rubocop's defaults in ways that do not make it harder to read,
# and reformatting the tree to satisfy them would be noise in every future diff.
#
# TargetRubyVersion is load-bearing, not decoration: without it rubocop parses as
# Ruby 2.7, rejects syntax this code uses (endless methods, rightward assignment) and
# worse, skips analysis of any file it cannot parse -- which is how a real offense
# hides behind a syntax complaint.
AllCops:
  TargetRubyVersion: 3.1
  NewCops: disable        # a rubocop upgrade must not turn a green build red
  SuggestExtensions: false
  Exclude:
    - ".staging/**/*"
    - "log/**/*"
    - "tmp/**/*"

# Thresholds are this project's, not rubocop's, which are written for ten-line methods.
# Nothing is excused by raising a limit: every exclusion below names its files, and each
# one says why. (Rubocop reads a top-level key as a cop, so each anchor is declared
# where it is first used.)
Metrics/ClassLength:
  Max: 400
Metrics/BlockNesting:
  Max: 3

# test/, tools/ and scripts/ are held to the Lint and Security departments, not to
# Metrics. A test that builds a fixture in twenty lines is clearer than four extracted
# helpers; a tool is one block by construction (RubyClaw.tool(...) { |a| ... }); the
# Telegram stub in scripts/ is a test fixture that never ships.
Metrics/MethodLength:
  Max: 40
  Exclude: &not_shipped
    - "test/**/*"
    - "tools/**/*"
    - "scripts/**/*"
Metrics/BlockLength:
  Max: 25
  Exclude: *not_shipped
Metrics/ParameterLists:
  Max: 6
  Exclude: *not_shipped

# ask_model, discover_chat, write! and handle_command score high on ABC and complexity
# for one reason: each branch is a different question to ask or a different command to
# answer, and they are flat and independent rather than nested. They are covered by
# tests that drive every branch (test/setup_test.rb against a stubbed Telegram API, plus
# the chat and CLI tests), and splitting them further would hide the list of questions
# or commands from the reader. Every other file keeps the default limits.
Metrics/AbcSize:
  Max: 30
  Exclude: &flow_files
    - "test/**/*"
    - "tools/**/*"
    - "scripts/**/*"
    - "lib/setup.rb"
    - "lib/telegram.rb"
    - "bin/claw"
Metrics/CyclomaticComplexity:
  Max: 10
  Exclude: *flow_files
Metrics/PerceivedComplexity:
  Max: 12
  Exclude: *flow_files

# One file per surface, deliberately: someone diagnosing a first run needs the whole
# wizard in front of them, and the audit's own module is easier to follow end to end
# than split across files that only make sense together.
Metrics/ModuleLength:
  Max: 150
  Exclude:
    - *not_shipped
    - "lib/setup.rb"
    - "lib/consolidate.rb"
